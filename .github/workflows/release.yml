name: Release

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
  push:
    branches:
      - master
    paths: [
      '.github/workflows/release.yml',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.cuh',
      '**/*.swift',
      '**/*.m',
      '**/*.metal',
      '**/*.comp',
      '**/*.glsl'
    ]

cache-mode: write
permissions:
  actions: write
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON -DLLAMA_CONNECT=ON"

# note: run this workflow one at a time for better cache reuse
concurrency:
  group: release
  queue: max

jobs:
  check-release:
    runs-on: ubuntu-slim

    permissions:
      contents: write

    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.tag.outputs.name }}

    steps:
      - id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            if echo "$COMMIT_MESSAGE" | grep -q '\[no release\]'; then
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "should_release=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY_RELEASE }}

      - name: Determine tag name
        if: ${{ steps.check.outputs.should_release == 'true' }}
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Create and push git tag
        if: ${{ steps.check.outputs.should_release == 'true' }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping creation"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

  ubuntu-24-rocm:
    needs: [check-release, ui-build]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}

    runs-on: ubuntu-24.04

    env:
      # Build all gfx90x targets supported by TheRock's current target matrix.
      GPU_TARGETS: "gfx900;gfx906;gfx908;gfx90a;gfx90c;gfx942;gfx950"
      ROCM_INDEX_URL: "https://nightly.repo.amd.com/rocm/whl-next/"

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download UI build
        uses: actions/download-artifact@v8
        with:
          name: llama-ui.zip
          path: tools/ui/dist

      - name: Free up disk space
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: release-ubuntu-24.04-rocm-therock-nightly-gfx90x-x64
          evict-old-files: 1d
          max-size: "2G"

      - name: Tune ccache for ROCm
        run: |
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime
          ccache --set-config=depend_mode=true

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake wget

      - name: Setup latest TheRock nightly
        id: therock_env
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip

          # Install host libraries/toolchain plus device kernels for every gfx90x target.
          python -m pip install --index-url "$ROCM_INDEX_URL" \
            "rocm[libraries,devel,device-gfx900,device-gfx906,device-gfx908,device-gfx90a,device-gfx90c,device-gfx942,device-gfx950]"

          ROCM_PATH=$(rocm-sdk path --root)
          CMAKE_PATH=$(rocm-sdk path --cmake)
          BIN_PATH=$(rocm-sdk path --bin)

          echo "ROCM_PATH=$ROCM_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PATH" >> "$GITHUB_ENV"
          echo "HIP_PATH=$ROCM_PATH" >> "$GITHUB_ENV"
          echo "PATH=$BIN_PATH:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"

      - name: Build ROCm with UMA
        id: cmake_build
        run: |
          cmake -B build -S . \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DCMAKE_INSTALL_RPATH='$ORIGIN;$ORIGIN/lib' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGPU_TARGETS="$GPU_TARGETS" \
            -DAMDGPU_TARGETS="$GPU_TARGETS" \
            -DGGML_HIP=ON \
            -DGGML_HIP_UMA=ON \
            -DHIP_PLATFORM=amd \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j "$(nproc)"

      - name: Bundle ROCm runtime libraries and device data
        run: |
          set -euo pipefail
          mkdir -p build/bin/lib build/bin/share

          # Bundle TheRock's user-space runtime, libraries and device kernel data.
          # The host's AMDGPU kernel driver remains a system requirement.
          if [ -d "$ROCM_PATH/lib" ]; then
            cp -a "$ROCM_PATH/lib/." build/bin/lib/
          else
            echo "ROCm library directory not found: $ROCM_PATH/lib" >&2
            exit 1
          fi
          if [ -d "$ROCM_PATH/share" ]; then
            cp -a "$ROCM_PATH/share/." build/bin/share/
          fi

          cat > build/bin/llama-rocm-env.sh <<'EOF'
          # Source this file before running llama.cpp binaries from this directory.
          _LLAMA_ROCM_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          export ROCM_PATH="$_LLAMA_ROCM_DIR"
          export HIP_PATH="$_LLAMA_ROCM_DIR"
          export LD_LIBRARY_PATH="$_LLAMA_ROCM_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          unset _LLAMA_ROCM_DIR
          EOF
          chmod +x build/bin/llama-rocm-env.sh

          cat > build/bin/README-ROCm.txt <<'EOF'
          llama.cpp ROCm portable bundle

          This archive includes TheRock ROCm user-space libraries and device data
          for gfx900, gfx906, gfx908, gfx90a, gfx90c, gfx942 and gfx950.
          The AMDGPU kernel-mode driver must still be installed on the host.

          From this directory, initialize the bundled ROCm runtime in each shell:

              source ./llama-rocm-env.sh
              ./llama-cli --list-devices

          GGML_HIP_UMA was enabled at build time. UMA/managed-memory behavior also
          depends on the GPU, kernel driver and ROCm runtime capabilities.
          EOF

      - name: Get TheRock version
        run: |
          ROCM_VERSION_SHORT="$(python -c 'import importlib.metadata as m; print(m.version("rocm-sdk-core"))' | cut -d '.' -f 1,2)"
          echo "ROCM_VERSION_SHORT=$ROCM_VERSION_SHORT" >> "$GITHUB_ENV"

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf llama-${{ needs.check-release.outputs.tag_name }}-bin-ubuntu-rocm-${{ env.ROCM_VERSION_SHORT }}-gfx90x-x64.tar.gz \
            --transform "s,^\.,llama-${{ needs.check-release.outputs.tag_name }}," -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: llama-${{ needs.check-release.outputs.tag_name }}-bin-ubuntu-rocm-${{ env.ROCM_VERSION_SHORT }}-gfx90x-x64.tar.gz
          archive: false

      - name: ccache-clear
        uses: ./.github/actions/ccache-clear
        with:
          key: release-ubuntu-24.04-rocm-therock-nightly-gfx90x-x64

  ui-build:
    needs: [check-release]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    uses: ./.github/workflows/ui-build.yml
